name: Build OmniRoute for Hermes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out official OmniRoute v3.8.52 branch
        uses: actions/checkout@v4
        with:
          repository: diegosouzapw/OmniRoute
          ref: release/v3.8.52
          persist-credentials: false

      - name: Show upstream source revision
        run: |
          git log -1 --format='%H %ci %s'
          test -f Dockerfile

      - name: Set Docker image name
        shell: bash
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/omniroute-hermes:argon-opus" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish official OmniRoute source
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          target: runner-cli
          push: true
          tags: ${{ env.IMAGE }}
          build-args: |
            OMNIROUTE_USE_TURBOPACK=0
            OMNIROUTE_BUILD_MEMORY_MB=6144
            OMNIROUTE_BUILD_WORKERS=2
